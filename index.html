<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Панель статуса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Панель статуса</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#metrics">Показатели</a></li>
                <li class="nav-item"><a class="nav-link" href="#operations">Операции</a></li>
            </ul>
            <button class="btn btn-outline-light btn-sm me-3" data-bs-toggle="offcanvas" data-bs-target="#notices">Уведомления</button>
            <img src="images/avatar.svg" alt="Аватар" class="avatar rounded-circle">
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="alert alert-danger d-none" id="error">Не удалось загрузить данные. Запустите через Live Server.</div>

    <section id="metrics">
        <h1 class="h3">Показатели</h1>
        <div class="row g-3" id="metricsList"></div>
    </section>

    <section id="operations" class="mt-4">
        <h2 class="h4">Операции (<span id="count">0</span>)</h2>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">Добавить</button>
        <button class="btn btn-secondary btn-sm" id="toggleBtn">Скрыть таблицу</button>

        <div class="table-responsive mt-3" id="tableBox">
            <table class="table table-bordered bg-white">
                <thead>
                    <tr><th>№</th><th>Операция</th><th>Статус</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="addForm" novalidate>
            <div class="modal-header">
                <h5 class="modal-title">Новая операция</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label for="name" class="form-label">Название</label>
                <input type="text" class="form-control" id="name">
                <div class="form-text">Не короче 3 символов</div>
                <div class="invalid-feedback">Слишком короткое название</div>

                <label for="status" class="form-label mt-3">Статус</label>
                <select class="form-select" id="status">
                    <option>Новая</option>
                    <option>В работе</option>
                    <option>Готово</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="notices">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Уведомления</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="noticesList"></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast text-bg-success" id="toast">
        <div class="toast-body" id="toastText"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
